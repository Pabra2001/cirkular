<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050604">
  <title>CIRKULAR.radio</title>
  <link rel="preload" href="../assets/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../cirkular-back-arrow.css">
  <link rel="stylesheet" href="../transitions.css">
  <style>
    @font-face {
      font-family: "Cirkular Inter";
      src: url("../assets/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }

    :root {
      --bg: #050604;
      --lime: #bbff29;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--lime);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px;
      z-index: 20;
      pointer-events: none;
    }

    .top-bar a { pointer-events: auto; }
    .radio-embedded .top-bar {
      justify-content: flex-end !important;
      height: 46px;
      padding: 0 22px;
      background: var(--bg);
      border-bottom: 1px solid rgba(187, 255, 41, .28);
    }
    .radio-embedded .back-arrow,
    .radio-embedded .radio-get-app { display: none !important; }
    .radio-get-app {
      position: fixed;
      right: 22px;
      bottom: 18px;
      z-index: 20;
      font: 500 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(187, 255, 41, .68);
      text-decoration: none;
      transition: color .15s ease;
    }
    .radio-get-app:hover { color: #bbff29; }

    .brand-lockup {
      display: inline-flex;
      align-items: baseline;
      gap: 1px;
      text-decoration: none;
      color: var(--lime);
    }

    .brand-lockup .wordmark-mask {
      display: block;
      height: 16px;
      aspect-ratio: 1283 / 110;
      background: var(--lime);
      -webkit-mask: url("../media/wordmark.svg") left center / contain no-repeat;
      mask: url("../media/wordmark.svg") left center / contain no-repeat;
    }

    .radio-dot-wrap {
      position: relative;
      display: inline-flex;
      align-items: baseline;
    }

    .brand-lockup .radio-dot {
      font: 700 14px/1 "Cirkular Inter", sans-serif;
      letter-spacing: -0.01em;
      text-transform: lowercase;
      color: var(--lime);
    }

    /* Superscript blinking live dot ("to the power of" radio) */
    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 8px var(--lime);
      margin-left: 3px;
      transform: translateY(-9px);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    #waves {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .top-bar { padding: 14px 16px; }
    }
    .app-embedded .top-bar { justify-content: center !important; }
  </style>
  <script>
    (() => {
      const embed = new URLSearchParams(location.search);
      let embedded = embed.has("embed");
      if (embed.get("embed") === "app") document.documentElement.classList.add("app-embedded");
      try { if (window.self !== window.top) embedded = true; } catch { embedded = true; }
      if (embedded) document.documentElement.classList.add("radio-embedded");
    })();
  </script>
</head>
<body>
  <header class="top-bar">
    <a class="back-arrow" href="../" aria-label="Back to Cirkular home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12H4M11 5L4 12l7 7" stroke="currentColor" stroke-width="3" stroke-linejoin="miter"/></svg>
    </a>
    <a class="brand-lockup" href="../" aria-label="CIRKULAR Radio">
      <span class="wordmark-mask" role="img" aria-label="CIRKULAR"></span>
      <span class="radio-dot-wrap">
        <span class="radio-dot">.radio</span>
        <span class="live-dot" aria-hidden="true"></span>
      </span>
    </a>
  </header>

  <script>
    if (document.documentElement.classList.contains("radio-embedded")) {
      document.querySelector(".brand-lockup").removeAttribute("href");
    }
  </script>

  <canvas id="waves" aria-label="CIRKULAR live acoustic architecture"></canvas>
  <a class="radio-get-app" id="btn-radio-app" href="../cirkular-mac.zip" download style="display:inline-flex;align-items:center;gap:5px;"><span id="btn-radio-app-label">WIDGET</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 4v11m0 0l-5-5m5 5l5-5M4 20h16"/></svg></a>

  <script>
    (() => {
      let isPlaying = false;
      let audioEl = null;
      let ctx = null;
      let analyser = null;
      let freqData;
      let timeData;
      let binHz;
      const LINES = 32;
      const BINS = 64;
      const history = Array.from({ length: LINES }, () => new Float32Array(BINS));
      const accents = new Float32Array(LINES);
      let bass = 0, mids = 0, highs = 0;
      let avgBass = 0, avgVolume = 0;
      let beatPulse = 0;
      let phase = 0;
      let lastSlice = 0;
      let output = null;
      const appEmbedded = document.documentElement.classList.contains("app-embedded");
      let muted = appEmbedded;
      const embedded = document.documentElement.classList.contains("radio-embedded");

      function updateOutput() {
        if (output) output.gain.value = embedded && (muted || !isPlaying) ? 0 : 1;
      }

      if (appEmbedded) {
        let visible = false;
        const syncVisibility = () => {
          muted = !visible || document.hidden;
          updateOutput();
        };
        const observer = new IntersectionObserver(([entry]) => {
          visible = entry.intersectionRatio >= 0.5;
          syncVisibility();
        }, { threshold: 0.5 });
        observer.observe(document.documentElement);
        document.addEventListener("visibilitychange", syncVisibility);
      } else if (embedded) {
        const forceMute = () => {
          if (!muted) {
            muted = true;
            updateOutput();
            try { window.parent.postMessage({ type: "cirkular-radio-muted", muted: true }, "*"); } catch {}
          }
        };

        window.addEventListener("message", event => {
          if (event.source !== window.parent || event.origin !== "https://prnce.pages.dev") return;
          if (event.data?.type !== "cirkular-radio-mute" || typeof event.data.muted !== "boolean") return;
          muted = event.data.muted;
          updateOutput();
        });

        // Auto-mute when scrolled out of view and stay muted until user re-engages unmute
        if ("IntersectionObserver" in window) {
          const io = new IntersectionObserver(([entry]) => {
            if (!entry.isIntersecting) forceMute();
          }, { threshold: 0.05 });
          io.observe(document.documentElement);
        }
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) forceMute();
        });
      }

      function createCavernImpulse(audioCtx, duration = 4.2, decay = 2.8) {
        const rate = audioCtx.sampleRate;
        const length = Math.floor(rate * duration);
        const impulse = audioCtx.createBuffer(2, length, rate);
        for (let ch = 0; ch < 2; ch++) {
          const data = impulse.getChannelData(ch);
          let lp = 0;
          for (let i = 0; i < length; i++) {
            const t = i / length;
            const env = Math.pow(1 - t, decay) * (1 - Math.exp(-i / (rate * 0.025)));
            lp = lp * 0.72 + (Math.random() * 2 - 1) * 0.28;
            data[i] = lp * env;
          }
        }
        return impulse;
      }

      function initAudio() {
        if (ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        ctx = new AudioCtx();
        audioEl = new Audio();
        audioEl.crossOrigin = "anonymous";
        audioEl.preload = "none";

        const src = ctx.createMediaElementSource(audioEl);
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 9500;

        // 68ms pre-delay + air-absorption lowpass + heavy wet mix = massive, gargantuan hall/cavern
        const preDelay = ctx.createDelay(0.5);
        preDelay.delayTime.value = 0.068;

        const wetFilter = ctx.createBiquadFilter();
        wetFilter.type = "lowpass";
        wetFilter.frequency.value = 2800;

        const conv = ctx.createConvolver();
        conv.buffer = createCavernImpulse(ctx, 6.2, 2.2);

        const dry = ctx.createGain();
        const wet = ctx.createGain();
        dry.gain.value = 0.28;
        wet.gain.value = 0.92;

        analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.55;
        binHz = ctx.sampleRate / analyser.fftSize;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Float32Array(analyser.fftSize);

        src.connect(analyser);
        analyser.connect(filter);
        filter.connect(dry);
        filter.connect(preDelay);
        preDelay.connect(conv);
        conv.connect(wetFilter);
        wetFilter.connect(wet);
        output = ctx.createGain();
        updateOutput();
        dry.connect(output);
        wet.connect(output);
        output.connect(ctx.destination);
      }

      async function startStream() {
        initAudio();
        if (ctx.state === "suspended") await ctx.resume();
        audioEl.src = `/api/radio?ch=dub&t=${Date.now()}`;
        try {
          await audioEl.play();
          isPlaying = true;
          updateOutput();
          localStorage.setItem("ck_radio_ch", "dub");
          localStorage.setItem("ck_radio_playing", "1");
        } catch {
          isPlaying = false;
          updateOutput();
        }
      }

      function togglePlay() {
        if (isPlaying && audioEl) {
          audioEl.pause();
          audioEl.removeAttribute("src");
          audioEl.load();
          isPlaying = false;
          updateOutput();
          localStorage.setItem("ck_radio_playing", "0");
        } else {
          startStream();
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const a = document.getElementById("btn-radio-app");
        const lbl = document.getElementById("btn-radio-app-label");
        if (a) { a.href = "../app/"; a.removeAttribute("download"); }
        if (lbl) lbl.textContent = "GET APP";
      }
        }
      }

      const canvas = document.getElementById("waves");
      const c = canvas.getContext("2d");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.addEventListener("click", togglePlay);
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") { e.preventDefault(); togglePlay(); }
      });

      startStream();
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const a = document.getElementById("btn-radio-app");
        const lbl = document.getElementById("btn-radio-app-label");
        if (a) { a.href = "../app/"; a.removeAttribute("download"); }
        if (lbl) lbl.textContent = "GET APP";
      }

      let w = 0, h = 0;
      let mx = 0.5, my = 0.5, tx = 0.5, ty = 0.5;
      let pointerActive = false;
      let warpStrength = 0;

      function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", (e) => {
        tx = e.clientX / (w || 1);
        ty = e.clientY / (h || 1);
        pointerActive = true;
      });
      window.addEventListener("pointerdown", (e) => {
        tx = e.clientX / (w || 1);
        ty = e.clientY / (h || 1);
        pointerActive = true;
      });
      window.addEventListener("pointerleave", () => { pointerActive = false; });
      window.addEventListener("pointerup", (e) => {
        if (e.pointerType === "touch") pointerActive = false;
      });
      resize();

      function bandEnergy(low, high) {
        const first = Math.ceil(low / binHz);
        const end = Math.min(freqData.length, Math.ceil(high / binHz));
        let sum = 0;
        for (let i = first; i < end; i++) sum += (freqData[i] / 255) ** 2;
        return Math.sqrt(sum / Math.max(1, end - first));
      }

      function writeWaveSlice(now) {
        const t = now * 0.00075;
        const dt = Math.min(0.1, (now - lastSlice) / 1000);
        const prev = history[0];
        const slice = history.pop();
        const cap = value => Math.max(0, Math.min(1, value));
        let volume = 0;
        let low = 0, mid = 0, high = 0;

        if (analyser && isPlaying) {
          analyser.getByteFrequencyData(freqData);
          analyser.getFloatTimeDomainData(timeData);
          for (const sample of timeData) volume += sample * sample;
          volume = Math.sqrt(volume / timeData.length);
          low = bandEnergy(35, 180);
          mid = bandEnergy(180, 1400);
          high = bandEnergy(1400, 6000);
        }

        const live = volume > 0.002;
        avgVolume += (volume - avgVolume) * (1 - Math.exp(-dt / 1.4));
        bass += (low - bass) * (1 - Math.exp(-dt / (low > bass ? 0.075 : 0.26)));
        mids += (mid - mids) * (1 - Math.exp(-dt / 0.15));
        highs += (high - highs) * (1 - Math.exp(-dt / 0.12));
        avgBass += (bass - avgBass) * (1 - Math.exp(-dt / 0.8));

        const attack = live ? cap((bass - avgBass - 0.025) * 5) : 0;
        beatPulse = Math.max(attack, beatPulse * Math.exp(-dt / 0.29));
        const dynamics = live ? cap(volume / Math.max(avgVolume * 1.65, 0.06)) : 0;
        phase += dt * (0.8 + mids * 1.8 + beatPulse * 1.25);

        const blend = 1 - Math.exp(-dt / 0.12);
        for (let b = 0; b < BINS; b++) {
          const u = b / (BINS - 1);
          const idle = (Math.sin(u * 8 - t * 1.2) * 0.5 + 0.5) * 0.20;
          const swell = (0.35 + 0.65 * Math.sin(u * 7.4 - phase) ** 2)
            * (bass * 0.56 + beatPulse * 0.38);
          const ripple = Math.sin(u * 16 + phase * 1.45) * mids * 0.28;
          const detail = Math.sin(u * 30 - phase * 2.1) * highs * 0.12;
          const target = idle + dynamics * (swell + ripple + detail);
          slice[b] = prev[b] + (target - prev[b]) * blend;
        }
        history.unshift(slice);
        accents.copyWithin(1, 0, LINES - 1);
        accents[0] = beatPulse * dynamics;
        lastSlice = now;
      }

      function draw(now) {
        mx += (tx - mx) * 0.1;
        my += (ty - my) * 0.1;
        warpStrength += ((pointerActive ? 1 : 0) - warpStrength) * 0.08;

        if (now - lastSlice >= 40) writeWaveSlice(now);

        c.fillStyle = "#050604";
        c.fillRect(0, 0, w, h);

        const lines = LINES;
        const padX = w * 0.14;
        const spanW = w - padX * 2;
        const topY = h * 0.24;
        const botY = h * 0.80;
        const stepY = (botY - topY) / (lines - 1);
        const waveHeight = Math.min(w * 0.20, h * 0.12, 106);
        const segs = 120;
        const mxPx = mx * w;
        const myPx = my * h;
        const warpRadius = Math.min(w, h) * 0.16;

        function computePoint(i, rowNorm, baseY, s) {
          const u = s / segs;
          let x = padX + u * spanW;

          // Center envelope keeps the iconic pulsar silhouette while letting real audio define the peaks
          const centerDist = (u - (0.46 + mx * 0.08)) / 0.28;
          const env = Math.exp(-centerDist * centerDist);

          const row = history[i];
          const bf = u * (BINS - 1);
          const b0 = Math.floor(bf);
          const b1 = Math.min(BINS - 1, b0 + 1);
          const frac = bf - b0;
          const liveVal = row[b0] * (1 - frac) + row[b1] * frac;

          const rowWeight = 0.55 + Math.sin(rowNorm * Math.PI) * 0.65;
          let y = baseY - env * liveVal * rowWeight * waveHeight;

          // Tactile warp field: lines smoothly bend and part around cursor / touch
          if (warpStrength > 0.005) {
            const dx = x - mxPx;
            const dy = y - myPx;
            const dist = Math.hypot(dx, dy);
            const falloff = Math.exp(-(dist * dist) / (warpRadius * warpRadius));
            const pushY = (dy >= 0 ? 1 : -1) * falloff * 52 * warpStrength;
            const pushX = (dx / (dist + 24)) * falloff * 18 * warpStrength;
            x += pushX;
            y += pushY;
          }

          return [x, y];
        }

        for (let i = 0; i < lines; i++) {
          const rowNorm = i / (lines - 1);
          const baseY = topY + i * stepY;
          const depth = Math.sin(rowNorm * Math.PI);
          const depthAlpha = 0.20 + depth * (0.65 + accents[i] * 0.15);

          const pts = new Array(segs + 1);
          for (let s = 0; s <= segs; s++) {
            pts[s] = computePoint(i, rowNorm, baseY, s);
          }

          c.beginPath();
          for (let s = 0; s <= segs; s++) {
            if (s === 0) c.moveTo(pts[s][0], pts[s][1]);
            else c.lineTo(pts[s][0], pts[s][1]);
          }
          c.lineTo(padX + spanW, baseY + 36);
          c.lineTo(padX, baseY + 36);
          c.closePath();
          c.fillStyle = "#050604";
          c.fill();

          c.beginPath();
          for (let s = 0; s <= segs; s++) {
            if (s === 0) c.moveTo(pts[s][0], pts[s][1]);
            else c.lineTo(pts[s][0], pts[s][1]);
          }
          c.strokeStyle = `rgba(187, 255, 41, ${depthAlpha})`;
          c.lineWidth = 1.05 + accents[i] * 0.45;
          c.stroke();
        }

        requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
