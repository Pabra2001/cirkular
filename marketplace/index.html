<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cirkular.pages.dev/transitions.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find secondhand pieces with Cirkular Marketplace.">
  <title>Cirkular Marketplace</title>
  <link rel="stylesheet" href="https://prnce.pages.dev/cirkular-back-arrow.css?rev=1">
  <link rel="stylesheet" href="https://prnce.pages.dev/cirkular-product/styles/marketplace.css?rev=card-line-limits">
  <link rel="stylesheet" href="https://prnce.pages.dev/cirkular-pagination.css?rev=1">
  <script src="https://prnce.pages.dev/cirkular-product/data/live_index.js"></script>
  <script type="module" src="https://prnce.pages.dev/cirkular-product/js/app.js?rev=readable-condition"></script>
<link rel="stylesheet" href="https://prnce.pages.dev/cirkular-search.css?rev=matched-caret-inset">
<script type="module" src="https://prnce.pages.dev/cirkular-search.js?rev=rotating-examples"></script>
  <link rel="stylesheet" href="https://prnce.pages.dev/cirkular-gestures.css?rev=1">
  <script defer src="https://prnce.pages.dev/cirkular-gestures.js?rev=1"></script>
  <style>
    .result-card { position: relative; }
    .ck-market-reload {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 4;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      background: transparent;
      color: #f5f7ee;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: color .15s ease, opacity .15s ease;
    }
    .ck-market-reload:hover {
      background: transparent;
      color: #bbff29;
    }
    .ck-market-reload.is-loading {
      color: #bbff29;
      pointer-events: none;
    }
    .ck-market-reload.is-loading svg {
      animation: ck-m-spin 680ms linear infinite;
    }
    @keyframes ck-m-spin { to { transform: rotate(360deg); } }

    /* Lock KORE 2x2 pillar headers to 1 clean line so status labels never wrap and break alignment */
    .kore-grid > *,
    .kore-pillars > *,
    [class*="kore"] [class*="head"],
    [class*="kore"] [class*="row"],
    [class*="pillar"] [class*="head"] {
      min-width: 0;
    }
    .kore-pillar-head,
    .kore-row-head,
    [class*="kore"] dt,
    [class*="kore"] header {
      display: flex;
      flex-wrap: nowrap !important;
      align-items: baseline !important;
      justify-content: space-between !important;
      gap: 6px !important;
      white-space: nowrap !important;
    }
    .kore-pillar-head > :last-child,
    .kore-row-head > :last-child,
    [class*="kore"] header > :last-child {
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      min-width: 0 !important;
      flex-shrink: 1 !important;
    }
  </style>
  <script>
    (() => {
      let reloadAttempt = 0;
      let lastQuery = '';
      const seenIds = new Set();
      const listingDetails = new Map();

      function recordDisplayedIds() {
        document.querySelectorAll('#marketplace-results .result-card a.result-open').forEach((link) => {
          try {
            const id = new URL(link.href, location.origin).searchParams.get('item');
            if (id) seenIds.add(id);
          } catch {}
        });
      }

      const origFetch = window.fetch.bind(window);
      window.fetch = async function(input, init) {
        const urlStr = typeof input === 'string' ? input : input?.url || '';
        if (urlStr.startsWith('/api/source?q=')) {
          const u = new URL(urlStr, location.origin);
          const q = (u.searchParams.get('q') || '').trim().toLowerCase();
          if (q !== lastQuery) {
            lastQuery = q;
            reloadAttempt = 0;
            seenIds.clear();
            listingDetails.clear();
          }
          if (reloadAttempt > 0) {
            recordDisplayedIds();
            u.searchParams.set('attempt', String(reloadAttempt));
            if (seenIds.size) u.searchParams.set('exclude', Array.from(seenIds).slice(-120).join(','));
          }
          const res = await origFetch(u.pathname + u.search, init);
          const embedded = document.documentElement.classList.contains("mp-embedded");
          if (res.ok && (embedded || (reloadAttempt > 0 && seenIds.size))) {
            try {
              const data = await res.clone().json();
              if (Array.isArray(data?.listings) && q === lastQuery) {
                if (embedded) {
                  for (const item of data.listings) {
                    const title = typeof item?.title === "string" ? item.title.trim() : "";
                    if (item?.id && title) listingDetails.set(item.id, {
                      title, brand: item.brand, size: item.size, colors: item.colors,
                      measurements: item.measurements, department: item.department
                    });
                  }
                }
                if (!reloadAttempt || !seenIds.size) return res;
                const unseen = data.listings.filter((item) => item?.id && !seenIds.has(item.id));
                if (unseen.length > 0 && unseen.length < data.listings.length) {
                  data.listings = unseen;
                  return new Response(JSON.stringify(data), {
                    status: res.status,
                    statusText: res.statusText,
                    headers: res.headers,
                  });
                }
                if (unseen.length === 0) {
                  // Cycled through all available listings; reset so next reload starts fresh
                  seenIds.clear();
                }
              }
            } catch {}
          }
          return res;
        }
        return origFetch(input, init);
      };

      function normalizeKoreLabels() {
        const map = {
          'limited disclosure': 'Limited',
          'partial disclosure': 'Partial',
          'minimal disclosure': 'Minimal',
          'no disclosure': 'Undisclosed',
          'material disclosed': 'Disclosed'
        };
        document.querySelectorAll('span, dd, strong, p, div').forEach((el) => {
          if (el.children.length > 0) return;
          const raw = (el.textContent || '').trim();
          const key = raw.toLowerCase();
          if (map[key] && raw !== map[key]) {
            el.textContent = map[key];
          }
        });
      }

      const RELOAD_SVG = '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 8A5.2 5.2 0 1 1 11.7 4.3L13.5 6"/><path d="M13.5 2.5V6H10"/></svg>';

      const narrowMarket = matchMedia("(max-width: 680px)");

      function rerunSearch(form, results) {
        if (results.getAttribute("aria-busy") === "true") return;
        recordDisplayedIds();
        reloadAttempt += 1;
        form.requestSubmit();
      }

      function fitEmbeddedCards(results) {
        if (!document.documentElement.classList.contains("mp-embedded")) return;
        results.querySelectorAll(".result-card").forEach(card => {
          const heading = card.querySelector(".result-copy h2");
          const link = card.querySelector(".result-open");
          if (heading && link && !heading.dataset.fitted) {
            heading.dataset.fitted = "true";
            const details = listingDetails.get(new URL(link.href).searchParams.get("item"));
            const title = details?.title || heading.textContent.trim();
            heading.textContent = title;
            const range = document.createRange();
            range.selectNodeContents(heading);
            if (range.getClientRects().length < 2) {
              const size = typeof details?.size === "string" ? details.size.trim() : "";
              const hasSize = size && !/^(unstated|unknown|n\/?a|see (title|desc).*)$/i.test(size);
              const sizeLabel = hasSize && !/^(?:one )?size\b/i.test(size) ? `Size ${size}` : size;
              const titleLower = title.toLowerCase();
              const attributes = [
                hasSize ? sizeLabel : "",
                details?.colors?.[0],
                details?.measurements?.[0],
                details?.department,
                details?.brand
              ].filter(value => typeof value === "string" && value.trim() && !titleLower.includes(value.trim().toLowerCase()));
              const seller = card.querySelector(".result-seller")?.textContent.trim();
              const secondLine = [...new Set(attributes)].slice(0, 2).join(" · ") || (seller ? `Listed on ${seller}` : "Secondhand listing");
              heading.replaceChildren(title + " ", document.createElement("br"), secondLine);
            }
          }

          const strip = card.querySelector(".result-thumbs");
          const photo = card.querySelector(".result-photo");
          if (strip && photo?.src && !strip.firstElementChild) {
            const thumbnail = document.createElement("span");
            thumbnail.className = "main-photo-thumb";
            thumbnail.setAttribute("aria-hidden", "true");
            const image = document.createElement("img");
            image.src = photo.src;
            image.alt = "";
            image.loading = "lazy";
            thumbnail.append(image);
            strip.append(thumbnail);
            strip.hidden = false;
          }
        });
      }

      function injectReloadButtons(form, results) {
        fitEmbeddedCards(results);
        normalizeKoreLabels();
        recordDisplayedIds();
        if (narrowMarket.matches) return;
        results.querySelectorAll(".result-card").forEach(card => {
          if (card.querySelector(".ck-market-reload")) return;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "ck-market-reload";
          button.setAttribute("aria-label", "Load new listings");
          button.title = "Load a fresh set of listings";
          button.innerHTML = RELOAD_SVG;
          button.addEventListener("click", () => {
            if (results.getAttribute("aria-busy") === "true") return;
            button.classList.add("is-loading");
            rerunSearch(form, results);
          });
          card.appendChild(button);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const results = document.getElementById("marketplace-results");
        const form = document.getElementById("sourcing-form");
        const input = document.getElementById("sourcing-input");
        const action = form.querySelector(".search-clear");
        action.innerHTML = RELOAD_SVG;
        let editing = false;

        function updateSearchAction() {
          const query = new URLSearchParams(location.search).get("q")?.trim();
          const canRefresh = narrowMarket.matches && !editing && query && input.value.trim() === query;
          action.dataset.action = canRefresh ? "reload" : "clear";
          action.setAttribute("aria-label", canRefresh ? "Load new listings" : "Clear search");
        }

        input.addEventListener("focus", () => {
          editing = true;
          updateSearchAction();
        });
        input.addEventListener("input", updateSearchAction);
        form.addEventListener("focusout", event => {
          if (event.relatedTarget === input || event.relatedTarget === action) return;
          editing = false;
          updateSearchAction();
        });
        form.addEventListener("submit", () => {
          if (!narrowMarket.matches || !input.value.trim()) return;
          editing = false;
          input.blur();
          updateSearchAction();
        });
        action.addEventListener("pointerdown", event => {
          if (editing) event.preventDefault();
        });
        action.addEventListener("click", event => {
          if (action.dataset.action !== "reload") return;
          event.stopImmediatePropagation();
          if (results.getAttribute("aria-busy") === "true") return;
          action.toggleAttribute("data-reloading", true);
          rerunSearch(form, results);
        }, { capture: true });

        const syncResults = () => {
          if (results.getAttribute("aria-busy") !== "true") {
            action.removeAttribute("data-reloading");
            document.documentElement.toggleAttribute("data-market-landing", !new URLSearchParams(location.search).get("q")?.trim());
          }
          injectReloadButtons(form, results);
          updateSearchAction();
        };
        new MutationObserver(syncResults).observe(results, {
          childList: true, subtree: true, attributes: true, attributeFilter: ["aria-busy"]
        });
        narrowMarket.addEventListener("change", syncResults);
        window.addEventListener("popstate", updateSearchAction);
        syncResults();
      });
    })();
  </script>
  <style>
    .search-clear:not([data-action="reload"]) svg,
    .search-clear[data-action="reload"]::before,
    .search-clear[data-action="reload"]::after { display: none; }

    .market-search .search-clear[data-action="reload"] {
      background-color: transparent;
    }

    .market-search .search-clear[data-action="reload"]:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: -6px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .search-clear[data-action="reload"][data-reloading] svg {
        animation: ck-m-spin 680ms linear infinite;
      }

      body:has(#marketplace-results[aria-busy="true"]) #sourcing-input:not(:placeholder-shown) {
        animation: ck-search-sway 760ms ease-in-out infinite alternate;
      }
    }

    @keyframes ck-search-sway {
      from { text-indent: 0; }
      to { text-indent: 8px; }
    }

    .market-landing-title { display: none; }
    .mp-embedded .back-arrow { display: none !important; }

    .mp-embedded #sourcing-form .search-submit:is(:active, [data-touch-pressed]) {
      background-color: var(--green);
      color: var(--black);
      transition-delay: 0s;
    }

    .mp-embedded .result-card .result-copy {
      display: flex;
      flex-direction: column;
      align-self: stretch;
    }

    .mp-embedded .result-card .result-copy h2 {
      flex: none;
      block-size: 2lh;
    }

    .mp-embedded .result-card .result-thumbs {
      --thumbnail-size: 46px;
      flex: none;
      block-size: calc(var(--thumbnail-size) + 8px);
    }

    .mp-embedded .result-card .main-photo-thumb {
      flex: 0 0 var(--thumbnail-size);
      height: var(--thumbnail-size);
      overflow: hidden;
      border: 2px solid var(--green);
      border-radius: 8px;
    }

    .mp-embedded .photo-dialog .result-thumbs:has(.main-photo-thumb) { display: none; }

    @media (max-width: 680px) and (max-height: 590px) {
      .mp-embedded .result-card .result-thumbs { --thumbnail-size: 38px; }
    }
    .mp-embedded .result-card .result-open {
      align-self: stretch;
      margin-block-start: auto;
    }

    @media (max-width: 680px) {
      .market-frame:has(.listing-carousel, .product-detail) { overflow: clip; }

      .mp-embedded .market-frame:has(.listing-carousel, .product-detail) {
        border-end-start-radius: 36px;
        border-end-end-radius: 36px;
      }
      .ck-market-reload { display: none; }

      .mp-embedded[data-market-landing] main[data-search-start] {
        align-content: safe center;
        padding-block: var(--market-top);
      }

      .mp-embedded[data-market-landing] .market-landing-title {
        display: block;
        margin: 0 var(--market-gutter) 14px;
        text-align: center;
        font-size: clamp(21px, 7vw, 32px);
        font-weight: 750;
        letter-spacing: -.055em;
        line-height: 1;
      }

      .mp-embedded[data-market-landing] .market-header { margin-block-end: 0; }
      .mp-embedded[data-market-landing] #marketplace-results:not(:has(.listing-carousel, .product-detail)) {
        display: none;
      }

      .mp-embedded .market-header {
        grid-template-columns: minmax(0, 1fr);
      }

      .mp-embedded .market-header .market-search {
        width: 100%;
        padding: 0;
      }

      .mp-embedded .search-entry {
        --search-inset: 5px;
        --search-button-width: 81px;
      }

      .mp-embedded .search-entry::before {
        inset-block: var(--search-inset);
        inset-inline-end: var(--search-inset);
      }

      .mp-embedded .search-entry:is(:focus-within, :has(input:not(:placeholder-shown)))::before {
        inset-inline-start: var(--search-inset);
      }

      .mp-embedded .market-search .search-submit {
        flex-basis: calc(var(--search-button-width) - var(--search-inset));
        min-height: 44px;
        margin: var(--search-inset);
      }

      .mp-embedded .market-search .search-entry:is(:focus-within, :has(input:not(:placeholder-shown))) .search-submit {
        padding: var(--search-inset);
        background-clip: content-box;
      }

      .mp-embedded .market-search .search-field input { font-size: 16px; }

      .mp-embedded .empty-panel {
        --photo-gutter: 12px;
        padding: var(--photo-gutter);
      }

      .mp-embedded .browse-photos { gap: var(--photo-gutter); }

    }
  </style>
  <script>
    const marketParams = new URLSearchParams(location.search);
    if (marketParams.has("embed") || window.self !== window.top) {
      document.documentElement.classList.add("mp-embedded");
      document.documentElement.toggleAttribute("data-market-landing", !marketParams.get("q")?.trim());
    }
  </script>
  <script>
    if (document.documentElement.classList.contains("mp-embedded") && matchMedia("(pointer: coarse)").matches) {
      let swipe;

      document.addEventListener("touchstart", event => {
        swipe = null;
        if (event.touches.length !== 1 || !event.target.closest(".result-track") ||
            event.target.closest(".result-thumbs") || document.querySelector(".photo-dialog[open]")) return;
        const { clientX, clientY } = event.touches[0];
        swipe = { clientX, clientY, horizontal: null };
      }, { passive: true });

      document.addEventListener("touchmove", event => {
        if (!swipe || event.touches.length !== 1) {
          swipe = null;
          return;
        }
        const touch = event.touches[0];
        const x = Math.abs(touch.clientX - swipe.clientX);
        const y = Math.abs(touch.clientY - swipe.clientY);
        if (swipe.horizontal === null && Math.max(x, y) >= 8) swipe.horizontal = x > y;
        // Keep a horizontal gesture in the iframe so the shared carousel sees touchend.
        if (swipe.horizontal && event.cancelable) event.preventDefault();
      }, { passive: false });

      for (const type of ["touchend", "touchcancel"]) {
        document.addEventListener(type, () => { swipe = null; }, { passive: true });
      }
    }
  </script>
</head>
<body>
  <main data-search-start>
    <div class="market-frame">
      <h1 class="market-landing-title">CIRKULAR.marketplace</h1>
      <header class="market-header">
        <a class="back-arrow" href="https://cirkular.pages.dev/" aria-label="Back to Cirkular home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12H4M11 5L4 12l7 7" stroke="currentColor" stroke-width="3" stroke-linejoin="miter"/></svg>
        </a>
        <form id="sourcing-form" class="market-search" role="search">
          <span class="search-brand"><img src="https://prnce.pages.dev/cirkular-world/media/wordmark.svg" alt="Cirkular"><span>·&nbsp;Marketplace</span></span>
          <div class="search-entry">
            <div class="search-field">
              <input name="q" type="search" id="sourcing-input" maxlength="240" aria-label="Search secondhand" placeholder="Levi’s straight-leg jeans" required>
              <button class="search-clear" type="button" aria-label="Clear search"></button>
            </div>
            <button class="action search-submit" type="submit">Search</button>
          </div>
        </form>
      </header>
      <section id="marketplace-results" aria-label="Marketplace listings" aria-busy="true"></section>
    </div>
    <p class="screen-reader" id="market-status" role="status"></p>
  </main>

</body>
