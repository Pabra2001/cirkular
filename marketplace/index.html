<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cirkular.pages.dev/transitions.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find secondhand pieces with Cirkular Marketplace.">
  <title>Cirkular Marketplace</title>
  <link rel="stylesheet" href="https://prnce.pages.dev/cirkular-back-arrow.css?rev=1">
  <link rel="stylesheet" href="https://prnce.pages.dev/cirkular-product/styles/marketplace.css?rev=mobile-press">
  <link rel="stylesheet" href="https://prnce.pages.dev/cirkular-pagination.css?rev=1">
  <script src="https://prnce.pages.dev/cirkular-product/data/live_index.js"></script>
  <script type="module" src="https://prnce.pages.dev/cirkular-product/js/app.js?rev=readable-condition"></script>
<link rel="stylesheet" href="https://prnce.pages.dev/cirkular-search.css?rev=matched-caret-inset">
<script type="module" src="https://prnce.pages.dev/cirkular-search.js?rev=rotating-examples"></script>
  <link rel="stylesheet" href="https://prnce.pages.dev/cirkular-gestures.css?rev=1">
  <script defer src="https://prnce.pages.dev/cirkular-gestures.js?rev=1"></script>
</head>
<body>
  <main data-search-start>
    <div class="market-frame">
      <header class="market-header">
        <a class="back-arrow" href="https://cirkular.pages.dev/" aria-label="Back to Cirkular home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12H4M11 5L4 12l7 7" stroke="currentColor" stroke-width="3" stroke-linejoin="miter"/></svg>
        </a>
        <form id="sourcing-form" class="market-search" role="search">
          <span class="search-brand"><img src="https://prnce.pages.dev/cirkular-world/media/wordmark.svg" alt="Cirkular"><span>·&nbsp;Marketplace</span></span>
          <div class="search-entry">
            <div class="search-field">
              <input name="q" type="search" id="sourcing-input" maxlength="240" aria-label="Search secondhand" placeholder="Levi’s straight-leg jeans" required>
              <button class="search-clear" type="button" aria-label="Clear search"></button>
            </div>
            <button class="action search-submit" type="submit">Search</button>
          </div>
        </form>
      </header>
      <section id="marketplace-results" aria-label="Marketplace listings" aria-busy="true"></section>
    </div>
    <p class="screen-reader" id="market-status" role="status"></p>
  </main>
<!-- Cloudflare Pages Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "09eef96fe7b44e15b57fe6b0170f31a6"}'></script><!-- Cloudflare Pages Analytics --><script>
window.addEventListener('pageshow', () => document.body.classList.remove('ck-exit-right'));
document.addEventListener('DOMContentLoaded', () => {
  document.body.classList.add('ck-enter-right');
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('.back-arrow, .back, [aria-label*="Back"]');
  if (!b) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  sessionStorage.setItem('ck-vt', 'exit-right');
  location.href = 'https://cirkular.pages.dev/';
}, true);
</script></body>
</html>
