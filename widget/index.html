<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIRKULAR.app</title>
  <link rel="preload" href="../assets/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../cirkular-back-arrow.css">
  <link rel="stylesheet" href="../transitions.css">
  <style>
    @font-face {
      font-family: "Cirkular Inter";
      src: url("../assets/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100dvh;
      background: #bbff29;
      color: #060705;
      font: 15px/1.45 "Cirkular Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 24px 28px 28px;
      gap: 18px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #060705;
      color: #bbff29;
      display: grid;
      place-items: center;
      text-decoration: none;
      transition: transform .15s ease;
    }
    .back:hover { transform: translateX(-2px); }
    .wordmark {
      display: inline-flex;
      align-items: baseline;
      gap: 2px;
      color: #060705;
    }
    .wordmark img {
      height: 17px;
      display: block;
    }
    .app-dot {
      font: 400 18px/1 "Cirkular Inter", sans-serif;
      letter-spacing: -.03em;
    }
    .card {
      background: #060705;
      color: #fff;
      border-radius: 26px;
      padding: clamp(24px, 3.5vw, 44px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 380px);
      align-items: center;
      gap: clamp(24px, 4vw, 52px);
      min-height: 0;
    }
    .copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 400px;
    }
    h1 {
      margin: 0 0 14px;
      font: 600 clamp(30px, 3.8vw, 46px)/1.05 "Cirkular Inter", sans-serif;
      letter-spacing: -.035em;
      color: #fff;
    }
    .sub {
      margin: 0 0 28px;
      font: 400 15px/1.5 "Cirkular Inter", sans-serif;
      color: rgba(255, 255, 255, .72);
    }
    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #060705;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 999px;
      font: 500 15px/1 "Cirkular Inter", sans-serif;
      letter-spacing: -.01em;
      transition: background .15s ease, transform .15s ease;
    }
    .dl-btn:hover {
      background: #bbff29;
      transform: translateY(1px);
    }
    /* Signature CIRKULAR white stage framing the black floating widget */
    .white-stage {
      width: 100%;
      background: #fff;
      border-radius: 22px;
      padding: 18px;
      display: grid;
      place-items: center;
      justify-self: end;
    }
    .widget-preview {
      width: 100%;
      aspect-ratio: 2 / 3;
      max-height: min(490px, 68dvh);
      border-radius: 16px;
      overflow: hidden;
      background: #060705;
      box-shadow: 0 14px 36px rgba(0, 0, 0, .28);
    }
    .widget-preview iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    @media (max-width: 560px) {
      body { padding: 16px; }
      .card {
        grid-template-columns: 1fr;
        padding: 28px 20px;
        gap: 28px;
      }
      .white-stage {
        max-width: 340px;
        margin: 0 auto;
        padding: 14px;
      }
      .widget-preview {
        height: 440px;
      }
    }
  </style>
</head>
<body class="ck-enter-right">
  <header class="top">
    <a class="back back-arrow" href="../" aria-label="Back to CIRKULAR">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12H4M11 5L4 12l7 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
    </a>
    <div class="wordmark">
      <img src="../cirkular-world/media/wordmark.svg" alt="CIRKULAR"><span class="app-dot">.app</span>
    </div>
  </header>

  <main class="card">
    <div class="copy">
      <h1>Float CIRKULAR.</h1>
      <p class="sub">Live TV and Radio on your Mac desktop or phone. Zero browser bars, zero tracking.</p>
      <a class="dl-btn" id="mac-dl" href="../cirkular-mac.zip" download>
        <span id="mac-dl-label">Download app</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" aria-hidden="true">
          <path d="M12 4v11m0 0l-5-5m5 5l5-5M4 20h16"/>
        </svg>
      </a>
    </div>

    <div class="white-stage">
      <div class="widget-preview">
        <iframe src="../app/?preview=1" allow="autoplay" title="CIRKULAR floating widget preview"></iframe>
      </div>
    </div>
  </main>

  <script>
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const btn = document.getElementById("mac-dl");
      const lbl = document.getElementById("mac-dl-label");
      if (btn) { btn.href = "../app/"; btn.removeAttribute("download"); }
      if (lbl) lbl.textContent = "Open mobile app";
    }
  </script>
</body>
</html>
