<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIRKULAR.app</title>
  <link rel="preload" href="../assets/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../cirkular-back-arrow.css">
  <link rel="stylesheet" href="../transitions.css">
  <style>
    @font-face {
      font-family: "Cirkular Inter";
      src: url("../assets/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100dvh;
      background: #bbff29;
      color: #060705;
      font: 15px/1.45 "Cirkular Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 24px 32px 32px;
      gap: 20px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #060705;
      color: #bbff29;
      display: grid;
      place-items: center;
      text-decoration: none;
      transition: transform .15s ease;
    }
    .back:hover { transform: translateX(-2px); }
    .wordmark {
      display: inline-flex;
      align-items: baseline;
      gap: 2px;
      color: #060705;
    }
    .wordmark img {
      height: 17px;
      display: block;
    }
    .app-dot {
      font: 400 18px/1 "Cirkular Inter", sans-serif;
      letter-spacing: -.03em;
    }
    .card {
      background: #060705;
      color: #fff;
      border-radius: 24px;
      padding: 48px 52px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      align-items: center;
      gap: 48px;
      min-height: 0;
    }
    .copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 440px;
    }
    h1 {
      margin: 0 0 14px;
      font: 600 clamp(32px, 4vw, 48px)/1.05 "Cirkular Inter", sans-serif;
      letter-spacing: -.035em;
      color: #fff;
    }
    .sub {
      margin: 0 0 28px;
      font: 400 15.5px/1.5 "Cirkular Inter", sans-serif;
      color: rgba(255, 255, 255, .72);
    }
    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #060705;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 999px;
      font: 500 15px/1 "Cirkular Inter", sans-serif;
      letter-spacing: -.01em;
      transition: background .15s ease, transform .15s ease;
    }
    .dl-btn:hover {
      background: #bbff29;
      transform: translateY(1px);
    }
    .rule {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, .14);
      margin: 30px 0 22px;
    }
    .mobile-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .qr-box {
      width: 72px;
      height: 72px;
      padding: 6px;
      border-radius: 10px;
      background: #060705;
      border: 1px solid rgba(187, 255, 41, .35);
      flex-shrink: 0;
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 4px;
    }
    .mobile-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .mobile-title {
      font: 500 13.5px/1.2 "Cirkular Inter", sans-serif;
      color: #fff;
    }
    .mobile-desc {
      font: 400 12.5px/1.4 "Cirkular Inter", sans-serif;
      color: rgba(255, 255, 255, .58);
    }
    .mobile-link {
      color: #bbff29;
      text-decoration: none;
      font: 500 12.5px/1.2 "Cirkular Inter", sans-serif;
      margin-top: 2px;
    }
    .mobile-link:hover { text-decoration: underline; }
    .widget-preview {
      width: 340px;
      height: 510px;
      border-radius: 18px;
      overflow: hidden;
      background: #060705;
      border: 1px solid rgba(187, 255, 41, .28);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .65);
    }
    .widget-preview iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    @media (max-width: 900px) {
      body { padding: 18px; }
      .card {
        grid-template-columns: 1fr;
        padding: 32px 24px;
        gap: 32px;
      }
      .widget-preview {
        width: 100%;
        max-width: 360px;
        height: 480px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body class="ck-enter-right">
  <header class="top">
    <a class="back back-arrow" href="../" aria-label="Back to CIRKULAR">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12H4M11 5L4 12l7 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
    </a>
    <div class="wordmark">
      <img src="../cirkular-world/media/wordmark.svg" alt="CIRKULAR"><span class="app-dot">.app</span>
    </div>
  </header>

  <main class="card">
    <div class="copy">
      <h1>Float CIRKULAR.</h1>
      <p class="sub">Live TV and Radio on your Mac desktop or phone. Zero browser bars, zero tracking.</p>
      <a class="dl-btn" id="mac-dl" href="../cirkular-mac.zip" download>
        <span id="mac-dl-label">Download for Mac</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" aria-hidden="true">
          <path d="M12 4v11m0 0l-5-5m5 5l5-5M4 20h16"/>
        </svg>
      </a>

      <div class="rule"></div>

      <div class="mobile-row">
        <div class="qr-box">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&amp;color=bbff29&amp;bgcolor=060705&amp;margin=0&amp;data=https%3A%2F%2Fcirkular.pages.dev%2Fapp%2F" alt="QR code for CIRKULAR mobile app">
        </div>
        <div class="mobile-meta">
          <span class="mobile-title">Mobile (iPhone / Android)</span>
          <span class="mobile-desc">Scan to open /app/ and tap Share → Add to Home Screen.</span>
          <a class="mobile-link" href="../app/">Open mobile app ↗</a>
        </div>
      </div>
    </div>

    <div class="widget-preview">
      <iframe src="../app/" allow="autoplay" title="CIRKULAR floating widget preview"></iframe>
    </div>
  </main>

  <script>
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const btn = document.getElementById("mac-dl");
      const lbl = document.getElementById("mac-dl-label");
      if (btn) { btn.href = "../app/"; btn.removeAttribute("download"); }
      if (lbl) lbl.textContent = "Open mobile app";
    }
  </script>
</body>
</html>
