<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#060705">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CIRKULAR">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <link rel="preload" href="../assets/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../cirkular-back-arrow.css">
    <title>CIRKULAR.app</title>
  <style>
    @font-face {
      font-family: "Cirkular Inter";
      src: url("../assets/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #bbff29;
      color: #060705;
      font: 14px/1.4 "Cirkular Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      grid-template-rows: minmax(40px, 1fr) auto minmax(40px, 1fr);
      padding: 20px 24px;
      gap: 14px;
    }
    .page-top {
      align-self: start;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #060705;
      color: #bbff29;
      display: grid;
      place-items: center;
      text-decoration: none;
      transition: transform .15s ease;
    }
    .back:hover { transform: translateX(-2px); }
    .wordmark {
      display: inline-flex;
      align-items: baseline;
      gap: 2px;
      color: #060705;
    }
    .wordmark img { height: 20px; display: block; }
    .app-dot { font: 400 17px/1 "Cirkular Inter", sans-serif; letter-spacing: -.03em; }

    .center-stage {
      display: grid;
      place-items: center;
      min-height: 0;
    }
    .widget-shell {
      width: min(360px, 100%);
      height: min(540px, calc(100dvh - 156px));
      border-radius: 18px;
      overflow: hidden;
      background: #060705;
      color: #bbff29;
      box-shadow: 0 24px 60px rgba(6, 7, 5, .28);
      display: grid;
      grid-template-rows: 36px minmax(0, 1fr);
    }
    .app-bar {
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #060705;
      border-bottom: 1px solid rgba(187, 255, 41, .18);
      z-index: 10;
    }
    .mode-pills {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mode-btn {
      width: 46px;
      height: 21px;
      border-radius: 10.5px;
      border: 0;
      background: transparent;
      color: rgba(187, 255, 41, .45);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .mode-btn[aria-pressed="true"] {
      background: rgba(187, 255, 41, .18);
      color: #bbff29;
    }
    .win-controls { display: flex; align-items: center; gap: 4px; }
    .win-btn {
      width: 18px;
      height: 18px;
      border: 0;
      padding: 0;
      background: transparent;
      color: rgba(187, 255, 41, .45);
      display: grid;
      place-items: center;
      cursor: default;
    }
    .win-x { font: 600 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .widget-shell:fullscreen, .widget-shell.is-fs {
      width: 100vw; height: 100dvh; max-width: none; border-radius: 0; box-shadow: none;
    }
    .widget-shell.is-fs { position: fixed; inset: 0; z-index: 99999; }
    .deck {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .mode-shop { display: none; }
    .track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform .28s cubic-bezier(.4, 0, .2, 1);
    }
    .track.is-radio { transform: translateX(-100%); }
    @media (pointer: coarse) {
      .mode-shop { display: grid; }
      .track.is-shop { transform: translateX(-200%); }
    }
    .pane {
      flex: 0 0 100%;
      min-width: 0;
      height: 100%;
      border: 0;
      background: #060705;
    }

    .caption {
      align-self: end;
      text-align: center;
      font: 500 13px/1.4 "Cirkular Inter", sans-serif;
      color: rgba(6, 7, 5, .82);
    }
    .caption a {
      color: #060705;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-bottom: 1px solid rgba(6, 7, 5, .35);
      padding-bottom: 1px;
    }
    .caption a:hover { border-bottom-color: #060705; }
    .cap-mobile { display: none; }
    @media (pointer: coarse) {
      .cap-desktop { display: none; }
      .cap-mobile { display: inline; }
    }

    /* Fullscreen standalone mobile PWA mode — zero green frame, pure edge-to-edge app */
    @media (display-mode: standalone) {
      html, body { background: #060705; overflow: hidden; }
      body { padding: 0; gap: 0; grid-template-rows: 1fr; }
      .page-top, .caption, .win-controls { display: none; }
      .widget-shell {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
        grid-template-rows: calc(40px + env(safe-area-inset-top)) minmax(0, 1fr);
      }
      .app-bar { padding: env(safe-area-inset-top) 14px 0; }
    }
  </style>
</head>
<body>
  <header class="page-top">
    <a class="back back-arrow" href="../" aria-label="Back to CIRKULAR">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12H4M11 5L4 12l7 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
    </a>
    <div class="wordmark">
      <img src="../media/mark.svg" alt="CIRKULAR">
    </div>
  </header>

  <main class="center-stage">
    <div class="widget-shell">
      <div class="app-bar">
        <div class="mode-pills" role="tablist" aria-label="CIRKULAR mode">
          <button class="mode-btn" id="btn-tv" type="button" role="tab" aria-pressed="true" aria-label="CIRKULAR TV">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="14" rx="2"/>
              <path d="M8 21h8"/>
            </svg>
          </button>
          <button class="mode-btn" id="btn-radio" type="button" role="tab" aria-pressed="false" aria-label="CIRKULAR Radio">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="8" width="18" height="12" rx="2"/>
              <path d="M7 8l10-4"/>
              <circle cx="8.5" cy="14" r="2"/>
              <path d="M14 12h4M14 16h4"/>
            </svg>
          </button>
          <button class="mode-btn mode-shop" id="btn-shop" type="button" role="tab" aria-pressed="false" aria-label="Shop CIRKULAR marketplace">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 8h14l-1 12H6L5 8z"/>
              <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
            </svg>
          </button>
        </div>
        <div class="win-controls" id="win-controls">
          <button class="win-btn" id="btn-pin" type="button" aria-label="Pin on top" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 3h9v2h-1.4l.8 6.2H18v2H6v-2h1.1l.8-6.2H7.5z"/><path d="M11.2 13.4h1.6V21l-.8 1.2-.8-1.2z"/></svg>
          </button>
          <button class="win-btn win-x" id="btn-close" type="button" aria-label="Close" disabled>&times;</button>
        </div>
      </div>

      <div class="deck">
        <div class="track" id="track">
          <iframe class="pane" id="frame-tv" src="/tv/?embed=app" allow="autoplay; fullscreen" title="CIRKULAR TV"></iframe>
          <iframe class="pane" id="frame-radio" src="about:blank" allow="autoplay" title="CIRKULAR Radio"></iframe>
          <iframe class="pane" id="frame-shop" src="about:blank" title="CIRKULAR Marketplace"></iframe>
        </div>
      </div>
    </div>
  </main>

  <footer class="caption">
    <span class="cap-desktop">
      <a href="../cirkular-mac.zip" download>Download Mac widget <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M12 4v11m0 0l-5-5m5 5l5-5M4 20h16"/></svg></a>
      &nbsp;·&nbsp; On phone, tap Share → Add to Home Screen
    </span>
    <span class="cap-mobile">Tap Share → Add to Home Screen to install as an app</span>
  </footer>

  <script>
    const track = document.getElementById("track");
    const btnTv = document.getElementById("btn-tv");
    const btnRadio = document.getElementById("btn-radio");
    const frameRadio = document.getElementById("frame-radio");
    let radioLoaded = false;

    const btnShop = document.getElementById("btn-shop");
    const frameShop = document.getElementById("frame-shop");
    let shopLoaded = false;

    function setMode(mode) {
      const isRadio = mode === "radio";
      const isShop = mode === "shop";
      if (isRadio && !radioLoaded) {
        frameRadio.src = "/radio/?embed=app";
        radioLoaded = true;
      }
      if (isShop && !shopLoaded) {
        frameShop.src = "/marketplace/?embed=1";
        shopLoaded = true;
      }
      track.classList.toggle("is-radio", isRadio);
      track.classList.toggle("is-shop", isShop);
      btnTv.setAttribute("aria-pressed", String(!isRadio && !isShop));
      btnRadio.setAttribute("aria-pressed", String(isRadio));
      btnShop.setAttribute("aria-pressed", String(isShop));
      localStorage.setItem("ck_mobile_mode", mode);
    }
    btnShop.addEventListener("click", () => setMode("shop"));

    btnTv.addEventListener("click", () => setMode("tv"));
    btnRadio.addEventListener("click", () => setMode("radio"));


    const shell = document.querySelector(".widget-shell");

    // Fullscreen request from the TV inside the card (CSS fullscreen always, native fullscreen as a bonus)
    function setCardFullscreen(on) {
      shell.classList.toggle("is-fs", on);
      if (on) { shell.requestFullscreen?.().catch(() => {}); }
      else if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); }
    }
    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) shell.classList.remove("is-fs");
    });
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") setCardFullscreen(false); });
    window.addEventListener("message", (e) => {
      if (!e.data || !e.data.ckFullscreen) return;
      setCardFullscreen(!shell.classList.contains("is-fs"));
    });

    {
      const saved = localStorage.getItem("ck_mobile_mode");
      const coarse = matchMedia("(pointer: coarse)").matches;
      if (saved === "radio" || (saved === "shop" && coarse)) setMode(saved);
    }
  </script>
</body>
</html>
