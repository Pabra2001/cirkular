<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#060705">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CIRKULAR">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <link rel="preload" href="../assets/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../cirkular-back-arrow.css">
  <link rel="stylesheet" href="../transitions.css">
  <title>CIRKULAR.app</title>
  <style>
    @font-face {
      font-family: "Cirkular Inter";
      src: url("../assets/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #bbff29;
      color: #060705;
      font: 14px/1.4 "Cirkular Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 20px 24px 24px;
      gap: 14px;
    }
    .page-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #060705;
      color: #bbff29;
      display: grid;
      place-items: center;
      text-decoration: none;
      transition: transform .15s ease;
    }
    .back:hover { transform: translateX(-2px); }
    .wordmark {
      display: inline-flex;
      align-items: baseline;
      gap: 2px;
      color: #060705;
    }
    .wordmark img { height: 20px; display: block; }
    .app-dot { font: 400 17px/1 "Cirkular Inter", sans-serif; letter-spacing: -.03em; }

    .center-stage {
      display: grid;
      place-items: center;
      min-height: 0;
    }
    .widget-shell {
      width: min(360px, 100%);
      height: min(540px, calc(100dvh - 150px));
      border-radius: 18px;
      overflow: hidden;
      background: #060705;
      color: #bbff29;
      box-shadow: 0 24px 60px rgba(6, 7, 5, .28);
      display: grid;
      grid-template-rows: 36px minmax(0, 1fr);
    }
    .app-bar {
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #060705;
      border-bottom: 1px solid rgba(187, 255, 41, .18);
      z-index: 10;
    }
    .mode-pills {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mode-btn {
      width: 46px;
      height: 21px;
      border-radius: 10.5px;
      border: 0;
      background: transparent;
      color: rgba(187, 255, 41, .45);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .mode-btn[aria-pressed="true"] {
      background: rgba(187, 255, 41, .18);
      color: #bbff29;
    }
    .win-controls { display: flex; align-items: center; gap: 4px; }
    .win-btn {
      width: 18px;
      height: 18px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #bbff29;
      display: grid;
      place-items: center;
      cursor: pointer;
      text-decoration: none;
    }
    .win-btn[aria-pressed="false"] { color: rgba(187, 255, 41, .4); }
    .deck {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .track {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform .28s cubic-bezier(.4, 0, .2, 1);
    }
    .track.is-radio { transform: translateX(-50%); }
    .pane {
      width: 50%;
      height: 100%;
      border: 0;
      background: #060705;
    }

    .caption {
      text-align: center;
      font: 500 13px/1.4 "Cirkular Inter", sans-serif;
      color: rgba(6, 7, 5, .82);
    }
    .caption a {
      color: #060705;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-bottom: 1px solid rgba(6, 7, 5, .35);
      padding-bottom: 1px;
    }
    .caption a:hover { border-bottom-color: #060705; }
    .cap-mobile { display: none; }
    @media (pointer: coarse) {
      .cap-desktop { display: none; }
      .cap-mobile { display: inline; }
    }

    /* Fullscreen standalone mobile PWA mode — zero green frame, pure edge-to-edge app */
    @media (display-mode: standalone) {
      html, body { background: #060705; overflow: hidden; }
      body { padding: 0; gap: 0; grid-template-rows: 1fr; }
      .page-top, .caption, .win-controls { display: none; }
      .widget-shell {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
        grid-template-rows: calc(40px + env(safe-area-inset-top)) minmax(0, 1fr);
      }
      .app-bar { padding: env(safe-area-inset-top) 14px 0; }
    }
  </style>
</head>
<body class="ck-enter-right">
  <header class="page-top">
    <a class="back back-arrow" href="../" aria-label="Back to CIRKULAR">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12H4M11 5L4 12l7 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
    </a>
    <div class="wordmark">
      <img src="../media/mark.svg" alt="CIRKULAR"><span class="app-dot">.app</span>
    </div>
  </header>

  <main class="center-stage">
    <div class="widget-shell">
      <div class="app-bar">
        <div class="mode-pills" role="tablist" aria-label="CIRKULAR mode">
          <button class="mode-btn" id="btn-tv" type="button" role="tab" aria-pressed="true" aria-label="CIRKULAR TV">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="14" rx="2"/>
              <path d="M8 21h8"/>
            </svg>
          </button>
          <button class="mode-btn" id="btn-radio" type="button" role="tab" aria-pressed="false" aria-label="CIRKULAR Radio">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="8" width="18" height="12" rx="2"/>
              <path d="M7 8l10-4"/>
              <circle cx="8.5" cy="14" r="2"/>
              <path d="M14 12h4M14 16h4"/>
            </svg>
          </button>
        </div>
        <div class="win-controls" id="win-controls">
          <button class="win-btn" id="btn-pin" type="button" aria-pressed="true" aria-label="Pin on top" title="Pin">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 3v2h-1v5l2 2v2h-4v7l-1 1-1-1v-7H7v-2l2-2V5H8V3h8z"/></svg>
          </button>
          <a class="win-btn" href="../" aria-label="Close" title="Close">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </a>
        </div>
      </div>

      <div class="deck">
        <div class="track" id="track">
          <iframe class="pane" id="frame-tv" src="/tv/?embed=1" allow="autoplay; fullscreen" title="CIRKULAR TV"></iframe>
          <iframe class="pane" id="frame-radio" src="about:blank" allow="autoplay" title="CIRKULAR Radio"></iframe>
        </div>
        <div class="win-controls" id="win-controls">
          <button class="win-btn" id="btn-pin" type="button" aria-pressed="true" aria-label="Pin on top" title="Pin">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 3v2h-1v5l2 2v2h-4v7l-1 1-1-1v-7H7v-2l2-2V5H8V3h8z"/></svg>
          </button>
          <a class="win-btn" href="../" aria-label="Close" title="Close">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="caption">
    <span class="cap-desktop">
      <a href="../cirkular-mac.zip" download>Download Mac widget <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M12 4v11m0 0l-5-5m5 5l5-5M4 20h16"/></svg></a>
      &nbsp;·&nbsp; On phone, tap Share → Add to Home Screen
    </span>
    <span class="cap-mobile">Tap Share → Add to Home Screen to install as an app</span>
  </footer>

  <script>
    const track = document.getElementById("track");
    const btnTv = document.getElementById("btn-tv");
    const btnRadio = document.getElementById("btn-radio");
    const frameRadio = document.getElementById("frame-radio");
    let radioLoaded = false;

    function setMode(mode) {
      const isRadio = mode === "radio";
      if (isRadio && !radioLoaded) {
        frameRadio.src = "/radio/?embed=1";
        radioLoaded = true;
      }
      track.classList.toggle("is-radio", isRadio);
      btnTv.setAttribute("aria-pressed", String(!isRadio));
      btnRadio.setAttribute("aria-pressed", String(isRadio));
      localStorage.setItem("ck_mobile_mode", mode);
    }

    btnTv.addEventListener("click", () => setMode("tv"));
    const pinBtn = document.getElementById("btn-pin");
    pinBtn.addEventListener("click", () => pinBtn.setAttribute("aria-pressed", String(pinBtn.getAttribute("aria-pressed") !== "true")));
    btnRadio.addEventListener("click", () => setMode("radio"));

    if (localStorage.getItem("ck_mobile_mode") === "radio") setMode("radio");
  </script>
</body>
</html>
