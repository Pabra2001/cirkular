<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIRKULAR — Smart · Sustainable · Secondhand</title>
  <link rel="preload" href="./assets/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./media/mark.svg" as="image">
  <link rel="preload" href="./media/wordmark.svg" as="image">
  <link rel="stylesheet" href="./transitions.css">
  <script>
    const vt = sessionStorage.getItem("ck-vt");
    if (vt) {
      document.documentElement.dataset.vt = vt;
      sessionStorage.removeItem("ck-vt");
    }
  </script>
  <style>
    @font-face {
      font-family: "Cirkular Inter";
      src: url("./assets/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #bbff29;
      color: #060705;
      font: 15px/1.4 "Cirkular Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px 36px;
    }
    .top, .bot {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meta {
      font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    :root { --home-rule: 1px solid rgba(6, 7, 5, .25); }
    .pill {
      background: transparent;
      color: #060705;
      border: var(--home-rule);
      padding: 9px 18px;
      border-radius: 99px;
      font: 400 12.5px "Cirkular Inter", sans-serif;
      text-decoration: none;
      white-space: nowrap;
      transition: background .18s ease, color .18s ease, transform .15s ease;
    }
    .pill:hover {
      background: #060705;
      color: #bbff29;
      transform: translateY(1px);
    }
    .mid {
      display: grid;
      grid-template-columns: 300px 1fr;
      align-items: center;
      gap: 48px;
    }
    .lockup img.mark {
      display: block;
      width: 36px;
      margin-bottom: 14px;
    }
    .lockup img.wm {
      display: block;
      width: 210px;
      margin-bottom: 34px;
    }
    nav {
      display: flex;
      flex-direction: column;
    }
    nav a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-top: var(--home-rule);
      color: #060705;
      text-decoration: none;
      font: 600 15px "Cirkular Inter", sans-serif;
      letter-spacing: -.02em;
      transition: padding-left .15s ease;
    }
    nav > a:last-child { border-bottom: var(--home-rule); }
    nav a:hover { padding-left: 6px; }
    nav a span.n {
      font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: .65;
    }
    .radio-entry { position: relative; }
    .radio-entry-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .radio-open .radio-entry-frame {
      position: fixed;
      inset: 0;
      height: 100dvh;
      z-index: 100;
    }
    .radio-open :is(.top, .bot, .oval, .lockup > img, nav > a, .radio-entry > a) {
      visibility: hidden;
    }
    .oval {
      width: 100%;
      max-width: 740px;
      aspect-ratio: 16 / 9.5;
      border-radius: 50%;
      justify-self: end;
      overflow: hidden;
      background: #060705;
    }
    .oval canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .footer-mobile-zero { display: none; }
    @media (max-width: 820px) {
      body { padding: 20px; gap: 24px; grid-template-rows: 1fr auto; }
      .top, .pill-arrow, .footer-desktop-tagline { display: none; }
      .footer-mobile-zero { display: inline; }
      .mid { grid-template-columns: 1fr; gap: 28px; }
      .oval { justify-self: center; }
    }
  </style>
</head>
<body>
  <header class="top">
    <span class="meta">Zero data collected</span>
    <a class="pill" href="./cirkular-extension.zip" download>Download Plugin<span class="pill-arrow" aria-hidden="true"> ↓</span></a>
  </header>

  <main class="mid">
    <div class="lockup">
      <img class="mark" src="./media/mark.svg" alt="">
      <img class="wm" src="./media/wordmark.svg" alt="CIRKULAR">
      <nav aria-label="CIRKULAR">
        <a href="./world#manifesto"><span>manifesto</span><span class="n">01</span></a>
        <a href="./world#catalog-intro"><span>catalog</span><span class="n">02</span></a>
        <a href="./marketplace/"><span>marketplace</span><span class="n">03</span></a>
        <a href="./cirkular-plugin/"><span>plugin</span><span class="n">04</span></a>
        <a href="./tv/"><span>tv</span><span class="n">05</span></a>
        <div class="radio-entry">
          <a href="./radio/" id="home-radio"><span>radio</span><span class="n">06</span></a>
        </div>
        <a href="./app/"><span>app</span><span class="n">07</span></a>
      </nav>
    </div>
    <div class="oval">
      <canvas id="halftone" aria-label="Animated dotted halftone circular field"></canvas>
    </div>
  </main>

  <footer class="bot">
    <span class="meta"><span class="footer-desktop-tagline">Smart · Sustainable · Secondhand</span><span class="footer-mobile-zero">Zero data collected</span></span>
    <span class="meta" id="rotating-live">KORE · Live</span>
  </footer>

  <script>
    (() => {
      if (!matchMedia("(pointer: coarse)").matches) return;
      const link = document.getElementById("home-radio");
      const frame = document.createElement("iframe");
      frame.className = "radio-entry-frame";
      frame.title = "CIRKULAR.radio";
      frame.allow = "autoplay";
      frame.hidden = true;
      frame.src = "/radio/?home-player=1";
      const homepageTitle = document.title;
      const setOpen = open => {
        document.documentElement.classList.toggle("radio-open", open);
        document.title = open ? "CIRKULAR.radio" : homepageTitle;
        frame.contentWindow?.cirkularShowHomePlayer?.(open);
      };

      window.cirkularOpenHomeRadio = () => {
        if (!history.state?.homeRadio) history.pushState({homeRadio: true}, "", link.href);
        setOpen(true);
      };
      window.cirkularCloseHomeRadio = () => history.back();
      window.addEventListener("popstate", () => setOpen(Boolean(history.state?.homeRadio)));

      frame.addEventListener("load", () => {
        frame.hidden = !frame.contentWindow?.cirkularShowHomePlayer;
      });
      link.addEventListener("click", event => {
        if (frame.hidden || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        window.cirkularOpenHomeRadio();
      });
      link.after(frame);
    })();
  </script>

  <script>
    (() => {
      const el = document.getElementById("rotating-live");
      if (!el) return;
      const labels = ["KORE · Live", "RADIO · Live", "TV · Live", "ARCHIVE · Live", "LOCAL · Zero Tracking"];
      const prev = parseInt(localStorage.getItem("ck_visit_label_idx") || "-1", 10);
      const next = (Number.isFinite(prev) ? prev + 1 : 0) % labels.length;
      localStorage.setItem("ck_visit_label_idx", String(next));
      el.textContent = labels[next];
    })();
  </script>

  <script>
    (() => {
      const canvas = document.getElementById("halftone");
      const ctx = canvas.getContext("2d");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      let w = 0, h = 0, dpr = Math.min(devicePixelRatio || 1, 2);
      let mx = 0.5, my = 0.45, tx = 0.5, ty = 0.45;
      const impulses = [];
      let lastImpulse = 0;

      function addImpulse(nx, ny, strength = 1) {
        impulses.push({ x: nx, y: ny, radius: 0, amp: 18 * strength, speed: 0.018 });
        if (impulses.length > 8) impulses.shift();
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        w = rect.width;
        h = rect.height;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const nx = (e.clientX - rect.left) / (rect.width || 1);
        const ny = (e.clientY - rect.top) / (rect.height || 1);
        tx = Math.max(0.15, Math.min(0.85, nx));
        ty = Math.max(0.15, Math.min(0.85, ny));
        const now = performance.now();
        if (nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1 && now - lastImpulse > 180) {
          lastImpulse = now;
          addImpulse(nx, ny, 0.75);
        }
      });
      canvas.addEventListener("pointerleave", () => {
        addImpulse(mx, my, 1.15);
        tx = 0.5;
        ty = 0.45;
      });
      canvas.addEventListener("pointerdown", (e) => {
        const rect = canvas.getBoundingClientRect();
        addImpulse((e.clientX - rect.left) / rect.width, (e.clientY - rect.top) / rect.height, 1.35);
      });

      resize();

      function draw(now) {
        const t = reduce.matches ? 2.4 : now * 0.00042;
        mx += (tx - mx) * 0.05;
        my += (ty - my) * 0.05;

        for (let k = impulses.length - 1; k >= 0; k--) {
          impulses[k].radius += impulses[k].speed;
          impulses[k].amp *= 0.974;
          if (impulses[k].amp < 0.25) impulses.splice(k, 1);
        }

        ctx.fillStyle = "#060705";
        ctx.fillRect(0, 0, w, h);

        const cx = w * (0.34 + mx * 0.32);
        const cy = h * (0.34 + my * 0.32);

        const rings = 15;
        for (let i = 1; i <= rings; i++) {
          const p = i / rings;
          const baseRx = w * (0.08 + p * 0.44);
          const baseRy = h * (0.08 + p * 0.44);
          ctx.beginPath();
          const segs = 160;
          for (let s = 0; s <= segs; s++) {
            const a = (s / segs) * Math.PI * 2;
            let wobble =
              Math.sin(a * 3 + t * 1.4 + i * 0.45) * (10 + p * 16) +
              Math.cos(a * 2 - t * 0.9 + i * 0.3) * (6 + p * 10);

            const px = cx + Math.cos(a) * baseRx;
            const py = cy + Math.sin(a) * baseRy;
            const pnx = px / (w || 1);
            const pny = py / (h || 1);

            for (let k = 0; k < impulses.length; k++) {
              const imp = impulses[k];
              const dist = Math.hypot(pnx - imp.x, pny - imp.y);
              const wave = Math.exp(-Math.pow((dist - imp.radius) * 4.8, 2));
              wobble += Math.sin((dist - imp.radius) * 8.5) * imp.amp * wave;
            }

            const x = cx + Math.cos(a) * (baseRx + wobble);
            const y = cy + Math.sin(a) * (baseRy + wobble * 0.72);
            if (s === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          const alpha = 0.14 + (1 - p) * 0.62;
          ctx.strokeStyle = `rgba(187, 255, 41, ${alpha.toFixed(3)})`;
          ctx.lineWidth = i === 1 || i === 5 || i === 10 ? 1.8 : 1;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#bbff29";
        ctx.fill();

        if (!reduce.matches) requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
