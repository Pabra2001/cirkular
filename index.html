<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIRKULAR — Smart · Sustainable · Secondhand</title>
  <style>
    @font-face {
      font-family: "Cirkular Inter";
      src: url("./assets/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #bbff29;
      color: #060705;
      font: 15px/1.4 "Cirkular Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px 36px;
    }
    .top, .bot {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meta {
      font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .pill {
      background: #060705;
      color: #bbff29;
      padding: 10px 18px;
      border-radius: 99px;
      font: 700 12.5px "Cirkular Inter", sans-serif;
      text-decoration: none;
      transition: transform .15s ease;
    }
    .pill:hover { transform: translateY(1px); }
    .mid {
      display: grid;
      grid-template-columns: 300px 1fr;
      align-items: center;
      gap: 48px;
    }
    .lockup img.mark {
      display: block;
      width: 36px;
      margin-bottom: 14px;
    }
    .lockup img.wm {
      display: block;
      width: 210px;
      margin-bottom: 34px;
    }
    nav {
      display: flex;
      flex-direction: column;
    }
    nav a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-top: 1px solid rgba(6, 7, 5, .25);
      color: #060705;
      text-decoration: none;
      font: 600 15px "Cirkular Inter", sans-serif;
      letter-spacing: -.02em;
      transition: padding-left .15s ease;
    }
    nav a:last-child { border-bottom: 1px solid rgba(6, 7, 5, .25); }
    nav a:hover { padding-left: 6px; }
    nav a span.n {
      font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: .65;
    }
    .oval {
      width: 100%;
      max-width: 740px;
      aspect-ratio: 16 / 9.5;
      border-radius: 50%;
      justify-self: end;
      overflow: hidden;
      background: #060705;
    }
    .oval video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @media (max-width: 820px) {
      body { padding: 20px; gap: 24px; }
      .mid { grid-template-columns: 1fr; gap: 28px; }
      .oval { justify-self: center; }
    }
  </style>
</head>
<body>
  <header class="top">
    <span class="meta">CIRKULAR · WORLD</span>
    <a class="pill" href="./cirkular-extension.zip" download>Download plugin ↓</a>
  </header>

  <main class="mid">
    <div class="lockup">
      <img class="mark" src="./media/mark.svg" alt="">
      <img class="wm" src="./media/wordmark.svg" alt="CIRKULAR">
      <nav aria-label="CIRKULAR">
        <a href="https://prnce.pages.dev/cirkular-world/#manifesto"><span>manifesto</span><span class="n">01</span></a>
        <a href="https://prnce.pages.dev/cirkular-world/#catalog"><span>catalog</span><span class="n">02</span></a>
        <a href="https://prnce.pages.dev/cirkular-product/?from=world"><span>marketplace</span><span class="n">03</span></a>
        <a href="./cirkular-plugin/"><span>plugin</span><span class="n">04 →</span></a>
      </nav>
    </div>
    <div class="oval">
      <video autoplay muted playsinline loop preload="metadata" src="./media/homepage-cinematic-loop.mp4" aria-label="Dithered film of people, landscapes, and wildlife"></video>
    </div>
  </main>

  <footer class="bot">
    <span class="meta">SMART · SUSTAINABLE · SECONDHAND</span>
    <span class="meta">KORE B–F · LIVE</span>
  </footer>
</body>
</html>
