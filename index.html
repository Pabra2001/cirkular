<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIRKULAR — Smart · Sustainable · Secondhand</title>
  <style>
    @font-face {
      font-family: "Cirkular Inter";
      src: url("./assets/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #bbff29;
      color: #060705;
      font: 15px/1.4 "Cirkular Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px 36px;
    }
    .top, .bot {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meta {
      font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .pill {
      background: transparent;
      color: #060705;
      border: 1.5px solid #060705;
      padding: 9px 18px;
      border-radius: 99px;
      font: 700 12.5px "Cirkular Inter", sans-serif;
      text-decoration: none;
      transition: background .18s ease, color .18s ease, transform .15s ease;
    }
    .pill:hover {
      background: #060705;
      color: #bbff29;
      transform: translateY(1px);
    }
    .mid {
      display: grid;
      grid-template-columns: 300px 1fr;
      align-items: center;
      gap: 48px;
    }
    .lockup img.mark {
      display: block;
      width: 36px;
      margin-bottom: 14px;
    }
    .lockup img.wm {
      display: block;
      width: 210px;
      margin-bottom: 34px;
    }
    nav {
      display: flex;
      flex-direction: column;
    }
    nav a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-top: 1px solid rgba(6, 7, 5, .25);
      color: #060705;
      text-decoration: none;
      font: 600 15px "Cirkular Inter", sans-serif;
      letter-spacing: -.02em;
      transition: padding-left .15s ease;
    }
    nav a:last-child { border-bottom: 1px solid rgba(6, 7, 5, .25); }
    nav a:hover { padding-left: 6px; }
    nav a span.n {
      font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: .65;
    }
    .oval {
      width: 100%;
      max-width: 740px;
      aspect-ratio: 16 / 9.5;
      border-radius: 50%;
      justify-self: end;
      overflow: hidden;
      background: #060705;
    }
    .oval canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    @media (max-width: 820px) {
      body { padding: 20px; gap: 24px; }
      .mid { grid-template-columns: 1fr; gap: 28px; }
      .oval { justify-self: center; }
    }
  </style>
</head>
<body>
  <header class="top">
    <span class="meta">CIRKULAR · WORLD</span>
    <a class="pill" href="./cirkular-extension.zip" download>Download plugin ↓</a>
  </header>

  <main class="mid">
    <div class="lockup">
      <img class="mark" src="./media/mark.svg" alt="">
      <img class="wm" src="./media/wordmark.svg" alt="CIRKULAR">
      <nav aria-label="CIRKULAR">
        <a href="https://prnce.pages.dev/cirkular-world/#manifesto"><span>manifesto</span><span class="n">01</span></a>
        <a href="https://prnce.pages.dev/cirkular-world/#catalog"><span>catalog</span><span class="n">02</span></a>
        <a href="https://prnce.pages.dev/cirkular-product/?from=world"><span>marketplace</span><span class="n">03</span></a>
        <a href="./cirkular-plugin/"><span>plugin</span><span class="n">04 →</span></a>
      </nav>
    </div>
    <div class="oval">
      <canvas id="halftone" aria-label="Animated dotted halftone circular field"></canvas>
    </div>
  </main>

  <footer class="bot">
    <span class="meta">SMART · SUSTAINABLE · SECONDHAND</span>
    <span class="meta">KORE B–F · LIVE</span>
  </footer>

  <script>
    (() => {
      const canvas = document.getElementById("halftone");
      const ctx = canvas.getContext("2d");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      let w = 0, h = 0, dpr = Math.min(devicePixelRatio || 1, 2);
      let mx = 0.5, my = 0.45, tx = 0.5, ty = 0.45;
      const ripples = [];
      let lastRipple = 0;

      function spawnRipple(nx, ny, strength = 1) {
        ripples.push({ x: nx, y: ny, r: 6, alpha: 0.75 * strength, speed: 1.8 + Math.random() * 1.1 });
        if (ripples.length > 14) ripples.shift();
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        w = rect.width;
        h = rect.height;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const nx = (e.clientX - rect.left) / (rect.width || 1);
        const ny = (e.clientY - rect.top) / (rect.height || 1);
        tx = Math.max(0.15, Math.min(0.85, nx));
        ty = Math.max(0.15, Math.min(0.85, ny));
        const now = performance.now();
        if (nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1 && now - lastRipple > 140) {
          lastRipple = now;
          spawnRipple(nx, ny, 0.85);
        }
      });
      canvas.addEventListener("pointerleave", () => {
        spawnRipple(mx, my, 1.2);
        tx = 0.5;
        ty = 0.45;
      });
      canvas.addEventListener("pointerdown", (e) => {
        const rect = canvas.getBoundingClientRect();
        spawnRipple((e.clientX - rect.left) / rect.width, (e.clientY - rect.top) / rect.height, 1.35);
      });

      resize();

      function draw(now) {
        const t = reduce.matches ? 2.4 : now * 0.00038;
        mx += (tx - mx) * 0.05;
        my += (ty - my) * 0.05;

        ctx.fillStyle = "#060705";
        ctx.fillRect(0, 0, w, h);

        const cx = w * (0.32 + mx * 0.36);
        const cy = h * (0.32 + my * 0.36);

        const rings = 15;
        for (let i = 1; i <= rings; i++) {
          const p = i / rings;
          const baseRx = w * (0.08 + p * 0.44);
          const baseRy = h * (0.08 + p * 0.44);
          ctx.beginPath();
          const segs = 120;
          for (let s = 0; s <= segs; s++) {
            const a = (s / segs) * Math.PI * 2;
            const wobble =
              Math.sin(a * 3 + t * 1.4 + i * 0.45) * (10 + p * 16) +
              Math.cos(a * 2 - t * 0.9 + i * 0.3) * (6 + p * 10);
            const x = cx + Math.cos(a) * (baseRx + wobble);
            const y = cy + Math.sin(a) * (baseRy + wobble * 0.72);
            if (s === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          const alpha = 0.14 + (1 - p) * 0.62;
          ctx.strokeStyle = `rgba(187, 255, 41, ${alpha.toFixed(3)})`;
          ctx.lineWidth = i === 1 || i === 5 || i === 10 ? 1.8 : 1;
          ctx.stroke();
        }

        // Expanding interactive ripples on move, leave, and click
        for (let i = ripples.length - 1; i >= 0; i--) {
          const rp = ripples[i];
          rp.r += rp.speed;
          rp.alpha *= 0.972;
          if (rp.alpha < 0.02) {
            ripples.splice(i, 1);
            continue;
          }
          ctx.beginPath();
          ctx.ellipse(rp.x * w, rp.y * h, rp.r * 1.35, rp.r, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(187, 255, 41, ${rp.alpha.toFixed(3)})`;
          ctx.lineWidth = 1.4;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#bbff29";
        ctx.fill();

        if (!reduce.matches) requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
